server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://postgres-dev:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  user-service:
    url: http://user-service-dev:8081/api/v1/users/getUser

resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  level:
    root: DEBUG
    com.subham.ordermanagement: DEBUG

  file:
    name: /logs/order-service-dev.log
