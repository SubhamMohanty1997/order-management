services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    container_name: mongo-stage
    volumes:
      - mongo_data_stage:/data/db

  postgres:
    image: postgres:16
    container_name: postgres-stage
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5


  order-service:
    build: ./order-service
    container_name: order-service-stage
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: stage
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-stage:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres


  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    container_name: user-service-stage
    environment:
      SPRING_PROFILES_ACTIVE: stage
    depends_on:
      - mongo

volumes:
  mongo_data_stage:
  postgres_data_stage:
