server:
  port: 8081

spring:
  mongodb:
    host: localhost       # Docker service name
    port: 27017
    database: userdb_local

logging:
  level:
    root: INFO
    com.subham.ordermanagement: DEBUG

  file:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,beans
  server:
    port: 9091

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true